<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inline and block elements</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Block elements start on a new line and take up the available width by default. -->
    <!-- Inline elements do not start on a new line and take up only the space they need. -->
    <!-- CSS can change an element's display behavior from block to inline or inline to block. -->

    <p>Hey I am a para</p>
    <a href="https://google.com">Google</a>
    <h4>I am a block element but now inline</h4>
    <div>I am a block element</div>
    <span>I am span and I am inline</span>
    <a href="">but now he is a block element</a>

</body>

</html>
