<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Property</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            height: 433px;
            width: 80vw;
            padding: 3px;
            margin: 3px;
            border: 2px solid black;
        }

        .box1 {
            background-color: aqua;

            /* sticky: Keeps the element in normal flow until it reaches the specified position,
            then it sticks while scrolling within its scrolling container. */
            /* position: sticky;

            top:0px;
            height: 111px;
            width:100%;
            margin: 0;
            padding: 0; */

            /* absolute: Removes the element from normal flow and positions it
            relative to its nearest positioned ancestor.
            If no positioned ancestor exists, it uses the initial containing block. */
            position: absolute;
            top: 0px;
            left: 3px;
        }

        .box2 {
            background-color: azure;

            /* relative: Keeps the element in normal flow and moves it
            from its original position using top, bottom, left or right. */
            /* position: relative;
            top: 34px;
            left: 56px; */
        }

        .box3 {
            background-color: antiquewhite;

            /* fixed: Removes the element from normal flow and positions it
            relative to the viewport. It generally stays in the same place while scrolling. */
            /* position: fixed;
            bottom: 0px;
            left:8vw;
            height: 111px; */
        }

        .box4 {
            background-color: purple;
        }



        .parent {
            padding: 43px;
            margin: 34px;
            border: 3px solid purple;

            /* Makes this element the containing block for its absolute-positioned descendants. */
            /* position: relative; */


            /* Exception: transform, filter, or perspective properties can also make an element appear as positioned */
            /* transform: translate(0); */
            /* filter: invert(0); */
            /* perspective: 0em; */
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>
