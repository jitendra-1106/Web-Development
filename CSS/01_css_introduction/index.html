<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>

    <!-- CSS stands for Cascading Style Sheets.
    It is a stylesheet language used to describe the visual
    presentation of a web page written in HTML.
    HTML creates the structure of a web page,
    while CSS adds styling to that structure. -->

    <style>
        /* Applies aqua text color and black background to div and span elements. */
        div ,span{
            color: aqua;
            background-color: black;
        }

        /* Applies red text color and yellow background to paragraph elements. */
        p{
            color: red;
            background-color: yellow;
        }
    </style>
</head>

<body>
    <div>Hey I am Jitendra and today I am in CSS Mood.</div>

    <div>I am good.</div>

    <!-- The span tag is an inline container used to group a specific part of text for styling. -->
    <span>I am also good.</span>

    <p>Lorem ipsum dolor <span>sit amet </span>.</p>

    <p>Lorem ipsum dolor sit amet consectetur adipisicing.</p>
</body>

</html>
