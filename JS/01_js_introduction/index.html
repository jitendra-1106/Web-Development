<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Introduction</title>
</head>

<body>
    <div class="box">
        Hey I am a Box
    </div>
    <button>Submit</button>

    <!-- JavaScript can be written directly inside the HTML file using the script tag -->
    <!-- 
    <script>
        alert("Hello world");
    </script> 
    :-----OR----:-
    -->

    <!-- External JavaScript file is connected using the src attribute -->
    <!-- This keeps HTML and JavaScript code separate and easier to manage -->
    <script src="script.js"></script>
</body>

</html>
