<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling list using CSS</title>
</head>
    <style>
        nav ul li{

            /* Sets the marker style of a list, such as bullets (disc, circle, square)
            or numbering styles (decimal, devanagari, lower-alpha). */
            list-style: devanagari;

            /* Sets a custom text or symbol as the list marker instead of the default marker. */
            list-style-type: "✌";
            /* list-style-type: devanagari; */

            /* Controls whether the marker appears inside or outside the list item's content box. */
            /* list-style-position:inside ; */

            /* Sets the background color of each list item. */
            /* background-color: yellow; */

            /* Adds a border around each list item. */
            /* border: 2px solid black; */

            /* Uses an image as the list marker. */
            /* list-style-image: url("https://user-images.githubusercontent.com/14011726/94132137-7d4fc100-fe7c-11ea-8512-69f90cb65e48.gif"); */

            /* Shorthand property for setting marker type, position and image together. */
            /* list-style: disc inside url("https://user-images.githubusercontent.com/14011726/94132137-7d4fc100-fe7c-11ea-8512-69f90cb65e48.gif"); */
        }
    </style>

<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>
</body>

</html>
