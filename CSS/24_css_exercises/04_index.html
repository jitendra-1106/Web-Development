<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise - 4</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }

        header{
            position: sticky;
            top: 0;
        }

        nav{
            background-color: orange;
            height: 60px;
        }

        main{
            background-color: aqua;
            padding: 35px;
        }

        .container{
            background-color: yellow;
            margin: 20px 26px;
            text-align: center;
        }

        .box1{
            border: 2px solid gray;
            background-color: gray;
            height: 50vh;
            width: 40%;
            display: inline-block;
            margin: 2px 10px;
        }

        .box2{
            border: 2px solid gray;
            background-color: gray;
            height: 50vh;
            width: 40%;
            display: inline-block;
            margin: 2px 10px;
        }

        .second{
            border-radius: 8px;
            border: 2px dotted white;
            background-color: black;
            /* height: 30vh; */
            margin:15px;
            color: wheat;
            font-size: 24px;
            text-align: center;
            padding-top: 70px;
            padding-bottom: 70px;
        }

        .circle{
            border-radius: 360px;
            background-color: red;
            height: 70px;
            width: 70px;
            position: fixed;
            bottom: 0vh;
            right: 0vw;
            columns: black;
            text-align: center;
            padding-top: 2px;
        }

        footer{
            height: 70px;
            margin: 15px;
            background-color: green;
        }
    </style>
</head>

<body>
    <header>
        <nav></nav>

    <main>
        <div class="container">

            <div class="box2"></div>
        </div>

        <div class="second">Welcome to Sigma Web Development Express</div>
        <div class="circle">JK</div>
    </main>

    <footer></footer>

</html>
