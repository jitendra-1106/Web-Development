<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark manager - Jitendra kumar</title>
</head>

<body>
    <h1>My Bookmarks</h1>

    <h2>Primary Bookmarks</h2>

    <!-- The a tag is used to create hyperlinks. -->
    <!-- The href attribute specifies the URL where the link will take the user. -->

    <!-- By default, a link opens in the same browser tab. -->
    <p><a href="https://www.github.com">open github</a></p>

    <!-- target="_blank" opens the link in a new browser tab. -->
    <p><a target="_blank" href="https://www.whatsapp.com">open whatsapp</a></p>
    <p><a target="_blank" href="https://www.stackoverflow.com">open Stackoverflow</a></p>
    <p><a target="_blank" href="https://www.youtube.com">open youtube</a></p>

    <h2>Secondary Bookmarks</h2>
    <p><a target="_blank" href="https://www.wikipidia.com">open wikipidia</a></p>

    <!-- The p tag is used to place the link in a separate paragraph, so each link appears on a new line. -->
</body>

</html>
