
<!-- HTML stands for HyperText Markup Language. It is used to structure webpage content. -->

<!DOCTYPE html>
<!-- Declares the document as HTML5 and tells the browser to use modern HTML standards. -->

<html lang="en">
<!-- The html element is the root element that contains the entire HTML document. -->
<!-- lang specifies the language of the webpage. Here, "en" means English. -->

<head>
    <!-- The head element contains metadata and settings about the webpage. -->

    <meta charset="UTF-8">
    <!-- Specifies the character encoding so that text and symbols display correctly. -->
    <!-- <meta> is a void element used to provide metadata about the webpage. -->
    <!-- charset is an attribute and "UTF-8" is its value. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- name and content are attributes of the meta element. -->
    <!-- Helps the webpage adjust its layout to different screen sizes. -->

    <title>Document</title>
    <!-- Sets the title displayed in the browser tab. -->

</head>

<body>
    <!-- The body element contains the content displayed on the webpage. -->

    HTML Basic Structure (Without CSS and JavaScript)

</body>

</html>


<!-- HTML TAGS AND ELEMENTS -->

<!-- A tag(tells the browser how to structure HTML content) is written inside angle brackets (< >) and defines the beginning or end of an HTML element. -->

<!-- An opening tag marks the beginning of an element. Example: <p> -->

<!-- A closing tag marks the end of an element. It contains a forward slash (/). Example: </p> -->

<!-- An HTML element generally consists of an opening tag, content and a closing tag. Example: <p>Hello</p> -->

<!-- Void elements do not have closing tags or content. Examples: <br>, <hr>, <img>, <meta> and <link>. -->

<!-- Attributes provide additional information or settings to an HTML element. -->

<!-- Attributes are generally written inside the opening tag as name="value". -->

<!-- Example 1: href is an attribute that specifies the destination URL of a link. -->
<!-- <a href="https://example.com">Visit Website</a>   -->

<!-- In the example above:
    a = HTML tag(<a> is an anchor tag used to create hyperlinks.)
    href = Attribute(href is an attribute that specifies where the link will take the user.)
    "https://example.com" = Attribute value(the value of the href attribute.)
    Visit Website = Content
    <a href="https://example.com"> = Opening tag with an attribute
    </a> = Closing tag
    The complete code = HTML element
-->
<!-- Example 2: src is an attribute -->
<!-- <img src="photo.jpg" alt="My Photo">   -->

<!-- In the example above:
    <img> is used to display an image on a webpage. 
    src is an attribute that specifies the path of the image file. 
    alt provides alternative text if an image cannot be displayed.
    <img src="photo.jpg" alt="My Photo">
-->
