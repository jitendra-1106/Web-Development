<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>

<body>

    <!-- The ul tag is used to create an unordered list with bullet points. -->
    <!-- The li tag defines each item in the list. -->

    <!-- The type attribute specifies the bullet style of an unordered list. -->
    <!-- disc is the default bullet style.[ex:-  <ul>...</ul>   ] -->
    <!-- square displays square bullets.[ex:- <ul type="square">...</ul> ] -->
    <!-- circle displays hollow circle bullets. -->

    <ul type="circle" >  
        <!-- CSS list-style-type is the recommended way to change bullet styles. -->
        <!--[<ul style="list-style-type: circle;"> ] same but recommended-->  
        <li>HTML</li>
        <li>CSS</li>
        <li>JAVASCRIPT</li>
    </ul>


    <!-- The ol tag is used to create an ordered list with numbers by default. -->
    <!-- The li tag defines each item in the list. -->
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JAVASCRIPT</li>
    </ol>


    <!-- The dl(description/definition list) tag is used to create a description/definition list. -->
    <!-- The dt(description term) tag defines the term or name in a description list. -->
    <!-- The dd(description details) tag provides the description of the term. -->
    <dl>
        <dt>HTML</dt>
        <dd>Hypertext markup language</dd>

        <dt>CSS</dt>
        <dd>Cascading style sheets</dd>

        <dt>JAVASCRIPT</dt>
        <dd>A programming language</dd>
    </dl>
    
</body>

</html>


<!-- type="1" displays numbers: 1, 2, 3 -->
<!-- type="A" displays uppercase letters: A, B, C -->
<!-- type="a" displays lowercase letters: a, b, c -->
<!-- type="I" displays uppercase Roman numerals: I, II, III -->
<!-- type="i" displays lowercase Roman numerals: i, ii, iii -->
