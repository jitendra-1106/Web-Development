<!-- 
1.Inline css: 
This is used in an HTML page using style attributes.
2.Internal css: 
It means to add a style tag and place the HTML page's style within it.
3.External css: 
It means to create a .css file and place all your styles inside that .css file. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Types</title>

    <!--External CSS-->
    <link rel="stylesheet" href="style.css">

    <!--Internal CSS-->
    <style>
        h2 {
            background-color: black;
            color: aqua;
        }
    </style>
</head>

<body>
    <!--Inline CSS-->
    <h1 style="color: yellow;background-color: red;">Three ways to add CSS to HTML:-</h1>

    <h2>Three ways to add CSS to HTML:</h2>

    <div>
        <ol>
            <li>Inline CSS</li>
            <li>Internal CSS</li>
            <li>External CSS</li>
        </ol>
    </div>

</body>

</html>

<!-- Inline CSS uses the style attribute inside an HTML element. -->

<!-- Internal CSS uses the style tag inside the HTML document. -->

<!-- External CSS uses a separate .css file connected using the link tag. -->
