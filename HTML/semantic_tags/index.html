<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Tags</title>
    <!--
    Semantic HTML tags provide meaning to the structure of webpage content.
    They do not automatically create styling or functionality.
    They help browsers, developers and screen readers understand the purpose of different sections.
    They can improve accessibility and help search engines understand webpage content.
    -->
</head>

<body>
    <header>
        <!-- The header tag represents the introductory section of a webpage. -->

        <nav>
            <!-- The nav tag defines a section containing navigation links. -->
            <!-- Navigation links are generally placed inside anchor tags within list items. -->

            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- The main tag represents the main content of the webpage. -->

        <h1>What are Semantic Tags</h1>

    </main>

    <footer>
        <!-- The footer tag represents the footer section of a webpage. -->

        Copyright CWH | All rights reserved

    </footer>

    <!-- <img src="semantic-tags.png" alt=""> -->
</body>

</html>

<!--
Using HTML's semantic tags can greatly benefit both your website's SEO and the maintainability of your code.
They offer a way to structure your HTML in a meaningful manner, making your website more accessible and easier to understand.
-->

<!-- The article tag represents a self-contained piece of content, such as a blog post or news article. -->
<!-- The section tag represents a thematic grouping of related content on a webpage. -->
<!-- The aside tag represents content related to the main content, such as a sidebar. -->
<!-- The figure tag is used to group images, diagrams or charts. -->
<!-- The figcaption tag provides a caption or description for a figure. -->
<!-- The time tag represents time-related information, such as dates and times. -->
