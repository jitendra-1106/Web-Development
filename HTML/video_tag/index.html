<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- The video tag is used to embed and display a video on a webpage. -->

    <!-- The src attribute specifies the path or location of the video file. -->
    <!-- The controls attribute displays built-in video controls like play, pause, volume and fullscreen. -->
    <video src="video1.mp4" controls></video>
</body>
</html>


<!-- The video tag is used to show a video on a webpage. -->
<!-- The img tag is used to display an image on a webpage. -->
<!-- The audio tag is used to play audio on a webpage. -->

<!-- src(source) tells the browser which video file to load. -->
<!-- controls adds play, pause, volume and fullscreen buttons. -->
