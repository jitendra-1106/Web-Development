<!-- Quick Quiz:
    Without using br tag, write a vertically aligned form asking for name, city and pincode of a user. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick quiz - 01</title>
</head>

<body>
    <form action="" method="post">

        <div>
            <label for="username">Enter name:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username">
        </div>

        <div>
            <label for="city">Enter city:</label>
            <input type="text" name="city" id="city" placeholder="city">
        </div>

        <div>
            <label for="pin">Enter pincode:</label>
            <input type="text" name="pincode" id="pin" placeholder="pincode">
        </div>

    </form>
</body>

</html>
