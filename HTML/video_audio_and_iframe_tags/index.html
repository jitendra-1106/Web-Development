<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>video and audio</title>
</head>
<body>
    <video src="video.mp4" controls width="322" height="400"></video>

    <audio src="audio.mp3" controls autoplay loop muted></audio>

    <iframe src="https://www.codewithharry.com/tutorial/html-iframes/" width="322" height="444"></iframe>
    
    <iframe width="560" height="315" src="https://www.youtube.com/embed/tVzUXW6siu0?si=NuQZuYqrMHn7Pg-i&amp;start=739" title="YouTube video player" allowfullscreen></iframe>

    <svg height="100" width="100">
        <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
    </svg>
    
    <img src="img.svg" alt="My Svg Image">
</body>

</html>
