<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jitendra kumar</title>

    <!-- Connect the external CSS file to style the webpage -->
    <link rel="stylesheet" href="style.css">
    <!-- The link tag connects an external CSS file to the HTML document. -->
    <!-- rel specifies the relationship between the HTML document and the linked file. -->
    <!-- stylesheet tells the browser that the linked file is a CSS stylesheet. -->
    <!-- href specifies the path of the CSS file. -->
    <!-- The link tag is placed inside the head section to load CSS before displaying the page. -->


</head>
<body>

    Hey this is my first website.

    <!-- Connect the external JavaScript file to add functionality -->
    <script src="script.js"></script>
    <!-- The script tag connects an external JavaScript file to the HTML document. -->
    <!-- src specifies the path of the JavaScript file. -->
    <!-- The script tag is placed before the closing body tag so HTML content loads first. -->
    
    <!-- The script tag is used to write JavaScript directly inside HTML. -->
    <script></script>

    <!-- type="module" loads JavaScript as an ES(ECMAScript) Module. -->
    <!-- Modules support import and export to share code between files. -->
    <script type="module" src=""></script>

</body>
</html>


<!-- Without the link tag, the external CSS file will not be connected. -->
<!-- Without the script tag, the external JavaScript file will not be connected. -->
<!-- If the href or src path is incorrect, the browser cannot load the specified file. -->

<!-- Emmet is a built-in VS Code feature that converts short abbreviations into complete HTML code. -->
<!-- link:css + Tab generates the CSS link tag. -->
<!-- script:src + Tab generates the JavaScript script tag. -->
