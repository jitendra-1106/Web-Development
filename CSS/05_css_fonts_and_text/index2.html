<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text</title>

    <style>

        h1{
            /* Controls the horizontal alignment of text, such as left, right, center or justify. */
            text-align: center;

            /* Changes the letter case of text, such as uppercase, lowercase or capitalize. */
            text-transform: uppercase;

            /* Adds or removes decorative lines, such as underline, overline or line-through. */
            text-decoration: underline;

            /* Sets the color of the text decoration line. */
            text-decoration-color: blue;

            /* Controls the style of the text decoration line, such as solid, dotted, dashed or wavy. */
            /* text-decoration-style: dotted; */

            /* Controls the thickness of the text decoration line. */
            text-decoration-thickness: 7px ;

            /* Controls the indentation of the first line of text. */
            /* text-indent: 45px; */
        }
        .lorem{
            /* Adds a border around an element by setting its width, style and color. */
            border: 2px solid red;

            /* Sets the width of an element. */
            width: 145px;

            /* Controls how words break when they reach the edge of their container. */
            word-break: break-all;

            /* Controls how overflowing text is displayed, such as showing ellipsis (...). */
            /* text-overflow: ellipsis;*/

            /* Controls whether overflowing content is visible, hidden or scrollable. */
            /* overflow: hidden;  */

        }
    </style>
</head>

<body>
    <div>
        <h1>About Text</h1>
        <p class="lorem">Lorem ipsum dolor sit amet consectetur adipisicing.</p>
    </div>
</body>

</html>
