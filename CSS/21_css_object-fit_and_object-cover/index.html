<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS object Fit and position</title>

    <style>

        .container {
            height: 488px;
            width: 466px;
            border: 2px solid black;
            /* background-color: azure; */

            /* Background image properties */
            /* Sets the background image of the element.
               The image is displayed behind the element's content. */
            background-image: url("https://us.123rf.com/450wm/progressman/progressman1909/progressman190900115/130695651-woman-in-black-coat-walking-along-the-sea.jpg?ver=6");
            
            /* Controls the position of the background image
               inside the element.
               Two values represent horizontal and vertical positions.
               Example: center center, left top, right bottom. */
            background-position: center center;

            /* Defines how far the background extends.
               border-box: Background extends underneath the border.
               padding-box: Background extends up to the padding edge.
               content-box: Background extends only to the content area. */
            background-clip: border-box;

            /* Controls how the background image repeats.
               no-repeat: Displays the image only once.
               repeat: Repeats in both directions (default).
               repeat-x: Repeats horizontally.
               repeat-y: Repeats vertically. */
            background-repeat: no-repeat;

            /* Background image sizing can be controlled using background-size.
               cover: Covers the entire container, cropping if necessary.
               contain: Fits the complete image, leaving empty space if necessary.
               auto: Uses the original image dimensions. */
            /* background-size: cover; */
        }

        img {
            width: 466px;
            height: 488px;

            /* Controls how the image fits inside its assigned width and height.
               It does not change the actual dimensions of the img element. */

            /* fill: Stretches the image to fill the box.
               The original aspect ratio may get distorted. */
            /* object-fit: fill; */


            /* cover: Resizes the image to cover the element's defined width and height
                while maintaining its original aspect ratio.
                The entire element is covered, even if some parts of the image get cropped. */
            /* object-fit: cover; */


            /* contain: Resizes the image to fit completely within the element's
                defined width and height while maintaining its original aspect ratio.
                The complete image remains visible, even if empty space is left. */
            /* object-fit: contain; */
            

            /* object-position:
                Controls the horizontal and vertical alignment of the image
                inside the <img> element's defined width and height.
                It determines which part of the image remains visible when cropping occurs.
                
                left top: Aligns the image to the top-left.
                center center: Aligns the image to the center (default).
                right bottom: Aligns the image to the bottom-right.
                50% 50%: Places the image at the center.
                10px 20px: Defines horizontal and vertical offsets
                relative to the available positioning space.
            */
            /* object-position: bottom right; */
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- <img src="https://images.unsplash.com/photo-1575936123452-b67c3203c357?q=80&w=1000&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8aW1hZ2V8ZW58MHx8MHx8fDA%3D" alt=""> -->
    </div>
</body>

</html>
