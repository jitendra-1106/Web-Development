<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }

        .container{
            border: 2px solid red;
            margin: 55px;
            height: 80vh;
            width: 80vw;
        }

        .box{
            border: 2px solid black;
            height: 70px;
            width: 70px;
            background-color: gray;
            display: flex;
            justify-content: center;
            align-items: center;

            /* rotate() rotates the element around its transform origin. */
            /* turn is an angle unit: 1turn = 360deg. */
            /* rotateZ() rotates the element around the Z-axis. */
            /* transform: rotate(45deg); */
            /* transform: rotate(.125turn); */
            /* transform: rotateZ(9deg); */

            /* scale() increases or decreases the element's size. */
            /* scale3d() scales the element along X, Y and Z axes. */
            /* scaleX() changes the element's width. */
            /* transform: scale(1.6); */
            /* transform: scale3d(1.2); */
            /* transform: scaleX(1.5); */

            /* skew() slants the element along X and Y axes. */
            /* skewX() slants the element along the X-axis. */
            /* transform: skew(4deg); */
            /* transform: skewX(3deg); */

            /* translateX() moves the element horizontally. */
            /* translateY() moves the element vertically. */
            /* Percentage values are based on the element's own dimensions. */
            /* transform: translateY(30%); */
            /* transform: translateX(30px); */

            /* Multiple transform functions can be combined in one property. */
            /* Their order matters because each transformation affects the next one. */
            /* transform: translateY(100%) skewX(40deg) translateX(45%); */

            /* Sets the point around which the transformation happens. */
            /* Default origin is 50% 50% (center of the element). */
            /* 0% 0% represents the top-left corner. */
            transform-origin: -0% -0%;

            /* Rotates the element 150 degrees around its transform origin. */
            transform: rotate(150deg);

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            BOX
        </div>
    </div>
</body>

</html>
