<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>

    <style>

        /* https://codepen.io/web-dot-dev/pen/ZELGraM */

        h1 {
            /* Sets the text color using a color name, such as red, blue or darkred. */
            /* color:darkred; */

            /* Sets the text color using a hexadecimal color code. */
            /* color: #0BEE0B; */

            /* Sets the text color using RGB values (Red, Green, Blue). */
            /* color: rgb(76, 125, 59); */

            /* Sets the text color using RGBA values (Red, Green, Blue, Alpha). Alpha(opacity) controls transparency. */
            /* color: rgba(255, 22, 5, 0.175) */

            /* Sets the text color using HSL values (Hue, Saturation, Lightness). */
            color: hsl(130, 61%, 44%);

            /* Sets the background color of an element. */
            background-color: rgb(76, 125, 59);
        }
    </style>
</head>

<body>
    <h1>Lets learn about colors</h1>
    <p>
        Color can be represented in:
        <ol>
            <li>Color Keywords</li>
            <li>Hex Color Code</li>
            <li>RGB</li>
            <li>RGBA</li>
            <li>HSL</li>
        </ol>
    </p>
</body>

</html>
