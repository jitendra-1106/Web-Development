<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise - 3</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap');
    </style>
    <style>
        *{
            /* margin: 0;
            padding: 0; */
            font-family:'Poppins', sans-serif;
        }
        :root{
            --color1:black;
            --primary-color:aquamarine;
            --color2:aqua;
            --color3:blue;
            --color4:orange;
            --color5:yellow;
        }
        .container{
            border: 2px solid var(--color1);
            background-color: var(--primary-color);
            margin: 20px;
            padding: 5px;
        }

        h2{
            --color6:red;
            border: 1px solid var(--color6);
            color: var(--color3);
            background-color: var(--color5);
        }

        p{
            --color7:gray;
            background-color:var(--color1);
            color: var(--color2);
            border: 2px dotted var(--color7);
        }

        .box{
            background-color:var(--color4);
            padding: 2px;
        }
        h3{
            --color8:pink;
            background-color: var(--color8);
            color: var(--color1);
        }

    </style>
</head>
<body>
    <!-- Create a multicolor website which can change color using CSS Variables -->
    <div class="container">
        <h2>Jitendra kumar</h2>
        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Temporibus, sit nemo, impedit aperiam consequuntur illo nam eveniet distinctio unde beatae obcaecati suscipit. Velit!</p>
        <div class="box">
            <h3>Sigma</h3>
        </div>
    </div>
</body>
</html>
